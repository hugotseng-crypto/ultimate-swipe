<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>滑动出盘 · 3v3</title>
<style>
  :root { --ink:#eef8ef; --grass:#1b8a3f; --end:#146330; --line:rgba(255,255,255,.88); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { height:100%; background:#07140c; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #hud { position:fixed; inset:0 0 auto 0; z-index:3; padding:calc(8px + env(safe-area-inset-top)) 14px 0; display:flex; justify-content:space-between; pointer-events:none; }
  .stat { font-weight:800; text-shadow:0 1px 6px rgba(0,0,0,.45); }
  .stat small { display:block; font-size:11px; opacity:.75; font-weight:600; }
  #stall { font-variant-numeric:tabular-nums; font-size:30px; line-height:1; }
  #stall.warn { color:#ffd60a; } #stall.hot { color:#ff453a; }
  #hint { position:fixed; left:0; right:0; bottom:calc(12px + env(safe-area-inset-bottom)); text-align:center; z-index:3; pointer-events:none; font-size:13px; font-weight:700; text-shadow:0 1px 8px #000; }
  #overlay { position:fixed; inset:0; z-index:6; display:flex; align-items:center; justify-content:center; background:rgba(5,14,8,.78); backdrop-filter:blur(8px); padding:22px; }
  #overlay.hide { display:none; }
  .card { width:min(440px,100%); background:#102418; border:1px solid rgba(255,255,255,.12); border-radius:22px; padding:24px 18px; text-align:center; }
  h1 { font-size:28px; letter-spacing:.08em; }
  p { margin:12px 0 18px; line-height:1.6; color:#cfe8d4; font-size:14px; }
  .go, .ghost { width:100%; border:0; border-radius:14px; padding:14px; font:inherit; font-weight:800; font-size:16px; }
  .go { background:#34c759; color:#06210d; }
  .ghost { background:#1c3324; color:#e9ffe9; margin-top:8px; }
</style>
</head>
<body>
<div id="hud">
  <div class="stat">我 <span id="scoreUs">0</span><small>先到 5 分</small></div>
  <div class="stat" style="text-align:center">STALL<div id="stall">0</div></div>
  <div class="stat" style="text-align:right">对方 <span id="scoreThem">0</span><small id="phase">持盘滑动出盘</small></div>
</div>
<div id="hint">任意位置向外滑即可出盘</div>
<div id="overlay">
  <div class="card">
    <h1>滑动出盘</h1>
    <p>3 对 3 极限飞盘原型。<br>持盘后在屏幕任意位置向外滑，松手出盘。<br>持盘不能跑。Stall 到 10 掉盘。达阵区接住得 1 分。</p>
    <button class="go" id="startBtn">开打</button>
    <button class="ghost" id="howBtn">再看一次</button>
  </div>
</div>
<canvas id="c"></canvas>
<script src="game.js"></script>
</body>
</html>
